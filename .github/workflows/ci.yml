name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps
      - name: Fetch and verify the source file (CC-BY-4.0, checksum-verified)
        run: python -m arabic_reviews ingest
      - name: Regenerated validation reports must match the committed ones byte for byte
        run: |
          python -m arabic_reviews validate
          git diff --exit-code -- reports/
      - name: Run tests
        run: pytest -q
