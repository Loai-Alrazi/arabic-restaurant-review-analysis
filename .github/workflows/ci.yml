name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps
      - name: Fetch and verify the source file (CC-BY-4.0, checksum-verified)
        run: python -m arabic_reviews ingest
      - name: Regenerated validation reports must match the committed ones byte for byte
        run: |
          python -m arabic_reviews validate
          git diff --exit-code -- reports/
      - name: Regenerated split and leakage report must match the committed ones byte for byte
        run: |
          python -m arabic_reviews split
          git diff --exit-code -- data/splits/ reports/
      - name: Regenerated EDA report (development partition only) must match the committed one
        run: |
          python -m arabic_reviews eda
          git diff --exit-code -- reports/eda.md
      - name: Run tests
        run: pytest -q

  notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies (project and notebook tools)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-notebook.txt
          pip install -e . --no-deps
      - name: Run the walkthrough notebook from a fresh clone (it fetches and prepares the data itself)
        run: python -m nbconvert --to notebook --execute notebooks/project_walkthrough.ipynb --output-dir "$RUNNER_TEMP" --ExecutePreprocessor.timeout=1800
      - name: The notebook run leaves the published reports and split unchanged
        run: git diff --exit-code -- reports/ data/splits/ notebooks/
